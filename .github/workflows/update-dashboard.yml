name: Generate Dashboard

on:
  schedule:
    # Runs every hour at :05 past the hour (UTC)
    - cron: '5 * * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance requests pandas numpy openpyxl

      - name: Unit tests
        run: |
          python -m unittest test_fast_metrics
          python test_gex.py

      - name: Generate dashboard
        run: python generate_dashboard.py
        env:
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}

      # Browser-level gate on the deployment-style static artifact: the SOFR-IORB
      # panel must render a sized chart with visible series, current KPI values,
      # and working range controls before anything is pushed to Pages.
      - name: Browser regression check
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node test_dashboard_browser.mjs index.html

      - name: Commit and push updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/spy-concentration-history.json data/fred-cache
          git diff --staged --quiet || git commit -m "chore: auto-update dashboard $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin main
          git push
